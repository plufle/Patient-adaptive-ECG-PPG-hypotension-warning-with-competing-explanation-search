[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtwin"
version = "0.0.1"
description = "Patient-adaptive ECG-PPG hypotension warning with competing-explanation search"
readme = "README.md"
requires-python = ">=3.10"
# Core dependencies only. Heavy stacks are optional extras so that each phase
# installs only what it needs (local PC has no GPU; Colab has torch preinstalled).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sim = ["torch>=2.2", "matplotlib>=3.8"]
signal = ["neurokit2", "vitaldb", "wfdb", "pyarrow>=14"]
ml = ["sbi", "lightgbm>=4.1", "scikit-learn>=1.3"]
dev = ["pytest>=7.4"]
all = ["dtwin[sim,signal,ml,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
